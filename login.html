<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ورود | TELEGRAM MARKET</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
  <form class="card login" method="post" action="/login">
    <h1>TELEGRAM<span>MARKET</span></h1>
    {% if error %}<div class="alert">{{ error }}</div>{% endif %}
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>نام کاربری<input name="username" autocomplete="username" required></label>
    <label>رمز عبور<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit">ورود</button>
  </form>
</body>
</html>
