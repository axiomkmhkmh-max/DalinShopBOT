# فقط برای تست محلی (Railway از این فایل استفاده نمی‌کند)
services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
  app:
    build: .
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017
    ports: ["8000:8000"]
    depends_on: [mongo]
volumes:
  mongo_data:
